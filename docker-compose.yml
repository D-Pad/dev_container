services:

  dev:
    build: .
    stdin_open: true
    tty: true
    container_name: dev
    hostname: developer
    restart: always
    volumes:
      - type: bind 
        source: ../dpad_llc
        target: /usr/local/dpad_llc
      - type: bind
        source: ./log_files
        target: /var/log/developer
      - dpad_llc_app:/mnt/dev_volume
      - type: bind 
        source: ./software 
        target: /usr/local/software
      - type: bind 
        source: ../websites
        target: /usr/local/websites
      - type: bind 
        source: ../homelab
        target: /usr/local/homelab
    ports: 
      - 5000-5003:5000-5003
      - 3000-3003:3000-3003 
      - 50051:50051 
    networks:
      - dpad_llc
    
    # Environment variables for easily launching development servers
    environment:
      - TRADE_API_PORT=3000
      - WEBPAGE_API_PORT=3000
      - DEV_MODE=1
      - DB_USER_NAME=dev
      - DB_PASSWORD=dev_db
      - DB_HOST_NAME_A=dev_postgre_db
      - DB_HOST_NAME_B=dev_maria_db
      - DB_PORT_NUM=5433
      - TZ=America/Chicago
      - GITKEY=${GITKEY}
      - GIT_USER=${GIT_USER}
      - GIT_EMAIL=${GIT_EMAIL}
      - OLLAMA_API_BASE=http://local_ai_ollama:11434
      - AIDER_MODEL=ollama_chat/qwen2.5-coder:14b
      - AIDER_CHAT_HISTORY_FILE=/var/log/developer/aider.chat.history.md

  dev_postgre_db:
    image: postgres:latest
    container_name: dev_postgre_db 
    restart: always
    hostname: dev_postgre_db
    shm_size: 128mb
    ports: 
      - 5433:5433
    command: -p 5433
    volumes:
      - type: bind 
        source: ./database/postgre/pgdata
        target: /var/lib/postgresql
      - type: bind 
        source: ./database/postgre/01-setup.sql
        target: /docker-entrypoint-initdb.d/01-setup.sql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - dpad_llc

  dev_maria_db:
    image: mariadb:latest
    container_name: dev_maria_db 
    restart: always
    hostname: dev_maria_db
    volumes:
      - type: bind 
        source: ./database/maria/.db
        target: /var/lib/mysql
      - type: bind 
        source: ./database/maria/perms.sql
        target: /docker-entrypoint-initdb.d/perms.sql
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    networks:
      - dpad_llc


volumes:
  dpad_llc_app:
    external: true

networks:
  dpad_llc:
    driver: bridge
    name: dpad_llc
  
