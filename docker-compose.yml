services:
  dev:
    build: .
    stdin_open: true
    tty: true
    container_name: dev
    hostname: developer
    restart: always
    volumes:
      - type: bind 
        source: ../dpad_llc
        target: /usr/local/dpad_llc
      - type: bind
        source: ./log_files
        target: /var/log/developer
      - dpad_llc_app:/mnt/dev_volume
      - type: bind 
        source: ./software 
        target: /usr/local/software
      - type: bind 
        source: ../websites
        target: /usr/local/websites
      - type: bind 
        source: ../homelab
        target: /usr/local/homelab
    ports: 
      - 5000:5000
      - 3000:3000 
    networks:
      - dpad_llc
    
    # Environment variables for easily launching development servers
    environment:
      - TRADE_API_PORT=3000
      - WEBPAGE_API_PORT=3000
      - DEV_MODE=1
      - DB_USER_NAME=dev
      - DB_PASSWORD=dev_db
      - DB_HOST_NAME=dev_db
      - DB_PORT_NUM=5433
      - TZ=America/Chicago

  dev_db:
    image: postgres:latest
    container_name: dev_db 
    restart: always
    hostname: database
    shm_size: 128mb
    ports: 
      - 5433:5433
    command: -p 5433
    volumes:
      - type: bind 
        source: ./database/pgdata
        target: /var/lib/postgresql
      - type: bind 
        source: ./database/01-setup.sql
        target: /docker-entrypoint-initdb.d/01-setup.sql
    environment:
      - POSTGRES_PASSWORD=dev_db
      - POSTGRES_USER=dev 
      - POSTGRES_DB=dev_db
    networks:
      - dpad_llc

volumes:
  dpad_llc_app:
    external: true

networks:
  dpad_llc:
    driver: bridge
    name: dpad_llc
  
